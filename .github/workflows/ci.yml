name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    name: Test (Go ${{ matrix.go-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ['1.21', '1.22', '1.23', '1.24', '1.25', '1.26', '1.27']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}

      - name: Verify dependencies
        run: go mod verify

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race -covermode atomic -coverprofile coverage.out ./...

      - name: Upload coverage
        if: matrix.go-version == '1.24'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out

  staticcheck:
    name: Static Analysis
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Install staticcheck
        run: go install honnef.co/go/tools/cmd/staticcheck@latest

      - name: Run staticcheck
        run: staticcheck ./...

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: [test, staticcheck]
    if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    permissions:
      contents: write
    concurrency:
      group: release
      cancel-in-progress: false
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      created: ${{ steps.release.outputs.created }}

    steps:
      - uses: actions/checkout@v4

      - name: Tag and release the version in client.go
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(sed -nE 's/.*Version *= *"([^"]+)".*/\1/p' client.go | head -1)"
          if [ -z "$VERSION" ]; then
            echo "::error::Version not found in client.go"
            exit 1
          fi
          TAG="v$VERSION"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

          STATUS=0
          git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null || STATUS=$?
          case "$STATUS" in
            0)
              echo "Tag $TAG already exists; nothing to release."
              echo "created=false" >> "$GITHUB_OUTPUT"
              ;;
            2)
              gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" --generate-notes
              echo "Created tag and release $TAG at $GITHUB_SHA."
              echo "created=true" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "::error::git ls-remote failed with exit status $STATUS"
              exit "$STATUS"
              ;;
          esac
